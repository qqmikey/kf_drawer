name: kf_drawer_example
description: Demonstrates the current kf_drawer API and optional features.
publish_to: none
version: 2.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cupertino_icons: ">=1.0.5 <2.0.0"
  flutter:
    sdk: flutter
  kf_drawer:
    path: ../

dev_dependencies:
  flutter_lints: ">=3.0.1 <7.0.0"
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
